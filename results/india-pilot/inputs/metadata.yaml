  in-incois-erddap:
    project_name: INCOIS ERDDAP ocean data server (Indian National Centre for Ocean
      Information Services)
    classification_labels: null
    project_type: data_portal
    country: India
    government_level: union
    operator: Indian National Centre for Ocean Information Services (INCOIS), autonomous
      body under the Ministry of Earth Sciences
    service_sector: ocean and environment data
    intended_audience: researchers and the public (ERDDAP pages for human browsing
      plus RESTful services); unknown beyond that
    expected_languages: null
    critical_journeys: null
    deployment_repository_relationship:
      status: supplied
      detail: upstream_relationship_only; Site footer self-reports ERDDAP 2.30.0;
        no operator-certified deployed commit or build provenance. Previously checked
        upstream release v2.30.0 is not proof of byte-for-byte deployment equivalence.
      evidence_url: https://incois.gov.in/site/index.jsp
      deployed_version: null
    auth: null
    offline_relevant: null
    long_process: null
    untranslated_allowlist: null
    notes: 'Access: Public dataset discovery and download/graph forms; no login attempted.
      Default Python TLS validation failed; Chromium with certificate checking enabled
      rendered the interface. Observation limitations: Generic open-source scientific
      data server (comparable to CKAN-type data-portal families) rather than an India-specific
      codebase. The incomplete TLS chain may break automated audit tools that do not
      fetch AIA intermediates. The ODIS catalogue recorded this server as offline
      in Oct 2025, so availability may vary. Languages other than en are ERDDAP''s
      automatic translations; hi and bn are among ~35 listed options. Classification
      unknown unless a sourced label is supplied. Observed UI languages are in the
      inventory; they do not establish expected languages.'
