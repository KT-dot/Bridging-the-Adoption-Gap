  in-bhashini-ulca:
    project_name: ULCA – Universal Language Contribution API platform (BHASHINI data
      & model repository)
    classification_labels: null
    project_type: data_portal
    country: India
    government_level: union
    operator: Digital India Bhashini Division (DIBD), Digital India Corporation, Ministry
      of Electronics & Information Technology
    service_sector: language data
    intended_audience: researchers, developers and data/model contributors (documented
      in README); public browsing of datasets, models and benchmarks
    expected_languages: null
    critical_journeys: null
    deployment_repository_relationship:
      status: supplied
      detail: upstream_relationship_only; Exact deployed version/commit unknown.
      evidence_url: https://www.tarento.com/case-studies/tarento-joins-ekstep-to-build-the-pillar-for-national-language-translation-mission-via-ulca-platform/
      deployed_version: null
    auth: null
    offline_relevant: null
    long_process: null
    untranslated_allowlist: null
    notes: 'Access: Public model/dataset dashboard rendered; count zero observed.
      Contribution sections require login. Read-only browser blocks POST requests;
      no contribution attempted. Observation limitations: Deployment host is ulcacontrib.org
      (not gov.in); operator attribution relies on the official bhashini.gov.in link.
      GitHub org ownership not independently verified. The README still points to
      bhashini.gov.in/ulca, which now serves the generic Bhashini shell. Licence copyright
      line reads ''ULCA (Project Sunbird)'' but ULCA is not one of the Sunbird ED/RC/cQube
      codebases. Latest dashboard rendered 611 characters; root URL intermittently
      blank. Data loading and screenshot capture incomplete. This is a specialist
      public explorer, not a benefits interface. Classification unknown unless a sourced
      label is supplied. Observed UI languages are in the inventory; they do not establish
      expected languages.'
