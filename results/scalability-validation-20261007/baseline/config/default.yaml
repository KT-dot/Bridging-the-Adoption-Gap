# dpi-audit default configuration.
# Every key here is documented in docs/methodology.md. A study config passed with
# --config is deep-merged over this file. Keys under `run` and `report` that only
# affect scheduling/presentation are excluded from the semantic config hash used for
# resume invalidation (see `non_semantic_keys`).

config_version: 1

run:
  label: research          # research | pilot | fixture — printed on every output to separate fixture/pilot results
  mode: hybrid              # static | runtime | hybrid (CLI --mode overrides)
  workers: 2                # parallel projects (each project runs in its own subprocess)
  project_timeout_s: 1800   # hard wall-clock limit per project subprocess
  retry_failed_on_resume: true
  log_level: INFO

acquisition:
  cache_dir: .cache/dpi-audit          # relative to the current working directory
  allow_remote_clone: true
  clone_depth: 1
  clone_timeout_s: 300
  max_repo_mb: 1500                    # larger checkouts are scanned only up to static limits
  # Git is run with a scrubbed environment: no global/system gitconfig, no credential
  # helpers, no hooks, no LFS smudge, no terminal prompts, no submodule recursion.

static:
  max_files: 6000                      # first-party files inspected per repository
  max_file_bytes: 600000               # larger text files are treated as generated
  max_total_bytes: 150000000
  exclude_dirs:                        # vendored, generated and build output directories
    - .git
    - node_modules
    - bower_components
    - jspm_packages
    - vendor
    - vendors
    - third_party
    - third-party
    - external
    - dist
    - build
    - out
    - .next
    - .nuxt
    - .svelte-kit
    - .output
    - .angular
    - target
    - coverage
    - __pycache__
    - .venv
    - venv
    - env
    - site-packages
    - .tox
    - .cache
    - .parcel-cache
    - storybook-static
    - public/build
    - static/dist
    - assets/vendor
  exclude_file_globs:
    - "*.min.js"
    - "*.min.css"
    - "*.bundle.js"
    - "*.chunk.js"
    - "*.map"
    - "*-lock.json"
    - "package-lock.json"
    - "yarn.lock"
    - "pnpm-lock.yaml"
    - "*.snap"
  generated_markers:                    # first 2 KB of a file
    - "@generated"
    - "Code generated by"
    - "DO NOT EDIT"
    - "This file is automatically generated"
    - "webpackBootstrap"
  # Documented exception: a repository that ships its user-facing site only as built
  # files (e.g. a docs/ or public/ folder of static HTML) is inspected because those
  # files ARE the first-party interface. Directories listed here are always included.
  include_dirs_override: []
  translation_coverage_pass: 0.95       # study-defined threshold for LANG-05 static coverage

runtime:
  browser: chromium
  headless: true
  executable_path: null                 # null = Playwright's pinned Chromium build
  user_agent_suffix: "DPI-Audit/0.1 (+accessibility research; contact: SET_CONTACT_IN_STUDY_CONFIG)"
  robots_user_agent: "DPI-Audit"
  respect_robots: true                  # must stay true for research runs
  per_host_min_delay_s: 2.0             # between top-level navigations / link checks per host
  navigation_timeout_s: 30              # CLI --timeout overrides
  settle_ms: 700
  network_idle_timeout_ms: 4000
  max_pages: 15                         # per interface (CLI --max-pages overrides)
  interface_budget_s: 1200              # soft budget: no new states/pages after this
  sitemap_max_urls: 300
  discovery_max_links: 400
  locale: en-US                         # browser locale / Accept-Language
  timezone: Asia/Kolkata
  viewports:
    desktop: {width: 1280, height: 800, is_mobile: false, device_scale_factor: 1}
    mobile:  {width: 390, height: 844, is_mobile: true, has_touch: true, device_scale_factor: 2}
  reflow_viewport: {width: 320, height: 640}
  zoom_emulation: {base_width: 1280, base_height: 800, factor: 2}
  sampling:                             # quotas filled in this order after the homepage
    critical_journeys: 5
    auth: 1
    service: 3
    form: 2
    help: 2
    contact: 1
    navigation: 15
  states:                               # bounded interaction states and per-interface page caps
    keyboard:      {enabled: true, max_pages: 6, max_tab_stops: 60, focus_screenshot_stops: 30}
    reflow:        {enabled: true, max_pages: 6}
    zoom:          {enabled: true, max_pages: 4}
    text_spacing:  {enabled: true, max_pages: 4}
    reduced_motion: {enabled: true, max_pages: 4}
    color_scheme:  {enabled: true, max_pages: 1}
    modal:         {enabled: true, max_pages: 5, max_dialogs_per_page: 2}
    form_error:    {enabled: true, max_forms: 3}
    language_switch: {enabled: true, max_pages: 1, max_options: 2}
    text_size_control: {enabled: true, max_pages: 1}
    offline:       {enabled: true, max_pages: 1}
    load_measure:  {enabled: true, max_pages: 3}
    link_check:    {enabled: true, max_links: 80}
  load_profile:                          # standardized throttled cold load (CDP network emulation)
    name: "study-3g-like"
    latency_ms: 150
    download_kbps: 1600
    upload_kbps: 750
    cpu_slowdown: 1
  safety:
    block_mutating_requests: true        # abort POST/PUT/PATCH/DELETE from pages
    allow_mutation_hosts: []             # only for explicit local fixtures / authorized test envs
    url_exclude_patterns:                # never navigated to or clicked
      - "(?i)log[-_]?out|sign[-_]?out|signoff|logoff"
      - "(?i)delete|remove|unsubscribe|cancel[-_]?account|deactivate"
      - "(?i)/(cart|checkout|payment|pay|donate)(/|$|\\?)"
      - "(?i)calendar|/\\d{4}/\\d{1,2}(/\\d{1,2})?/?$|[?&](date|month|year|day|week)="
      - "(?i)[?&](sort|order|filter|sessionid|sid|phpsessid|jsessionid)="
      - "(?i)\\.(pdf|zip|rar|7z|gz|tgz|docx?|xlsx?|pptx?|odt|ods|csv|apk|exe|dmg|msi|iso|mp3|mp4|avi|mov|jpg|jpeg|png|gif|svg|webp)(\\?|$)"
    max_query_variants_per_path: 1
    max_url_length: 300
    drop_query_params: ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content", "fbclid", "gclid"]

thresholds:                              # study-defined; reported in methodology.md
  lang_switch_min_changed_ratio: 0.30    # LANG-02: share of visible text segments that must change
  untranslated_pass_max_ratio: 0.10      # LANG-06
  untranslated_fail_min_ratio: 0.50      # LANG-06
  reflow_tolerance_px: 2
  min_target_px: 24                      # informational counts only; decisions use axe target-size
  focus_pixel_change_min: 8              # changed pixels needed to call a focus change "visible"
  page_weight_kb_max: null               # RES-01 study thresholds (null = measurement only)
  page_requests_max: null
  load_time_ms_max: null

keywords:                                # multilingual cue lists for heuristic detectors
  help:      ["help", "faq", "faqs", "frequently asked", "guide", "how to", "user manual", "सहायता", "मदद", "अक्सर पूछे", "सामान्य प्रश्न", "ayuda", "aide"]
  contact:   ["contact", "contact us", "support", "helpdesk", "help desk", "helpline", "call us", "संपर्क", "हमसे संपर्क", "हेल्पलाइन", "contacto", "contactez"]
  grievance: ["grievance", "complaint", "redress", "redressal", "cpgrams", "शिकायत", "परिवाद", "निवारण", "reclamación", "réclamation"]
  privacy:   ["privacy", "privacy policy", "data protection", "गोपनीयता", "निजता", "privacidad", "confidentialité"]
  accessibility_statement: ["accessibility statement", "accessibility", "screen reader access", "सुगम्यता", "अभिगम्यता", "accesibilidad", "accessibilité"]
  eligibility: ["eligibility", "eligible", "who can apply", "पात्रता", "कौन आवेदन", "elegibilidad", "éligibilité"]
  documents: ["documents required", "required documents", "document checklist", "what you need", "आवश्यक दस्तावेज", "आवश्यक दस्तावेज़", "documentos requeridos"]
  fees:      ["fee", "fees", "charges", "cost", "free of cost", "शुल्क", "फीस", "tarifa", "frais"]
  process:   ["how to apply", "application process", "steps to apply", "procedure", "process", "आवेदन कैसे", "प्रक्रिया", "cómo solicitar"]
  save_resume: ["save draft", "save as draft", "save and continue", "continue later", "resume application", "ड्राफ्ट", "सहेजें"]
  generic_link_text: ["click here", "here", "read more", "more", "link", "click", "details", "learn more", "यहाँ क्लिक करें", "यहां क्लिक करें", "और पढ़ें", "अधिक"]
  pause:     ["pause", "stop", "play", "रोकें"]
  skip:      ["skip", "jump to", "main content", "मुख्य सामग्री", "सामग्री पर जाएं"]
  text_size: ["a+", "a-", "a++", "a--", "increase font", "decrease font", "font size", "text size", "फ़ॉन्ट"]
  timeout:   ["session will expire", "session expired", "session timeout", "time remaining", "you will be logged out", "सत्र समाप्त"]

review:
  seed: "dpi-audit-review-v1"
  per_stratum: 2                         # records per (category x method x label-group) stratum
  human_only_per_project: 1
  min_reference_per_class: 10            # precision/recall only computed above this

report:
  strata: []                             # metadata fields to stratify feature_summary by
  allow_mixed_versions: false

evidence:
  screenshots: true
  screenshot_format: jpeg
  screenshot_quality: 70
  full_page_screenshots: false
  save_raw_axe: true                     # gzip JSON per page/viewport/state
  axe_max_nodes_per_rule: 20
  dom_excerpt_chars: 500

non_semantic_keys:
  - run.workers
  - run.log_level
  - run.retry_failed_on_resume
  - report
  - review
  - acquisition.cache_dir
