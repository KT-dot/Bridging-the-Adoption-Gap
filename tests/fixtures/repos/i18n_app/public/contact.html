<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="contact.title">Contact us – Fixture Benefits Portal</title>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to main content</a>
<header>
  <p class="brand"><a href="index.html" data-i18n="site.name">Fixture Benefits Portal</a></p>
  <label for="lang-select" data-i18n="lang.label">Language</label>
  <select id="lang-select" name="language">
    <option value="en" lang="en">English</option>
    <option value="hi" lang="hi">हिन्दी</option>
  </select>
  <nav aria-label="Main">
    <ul>
      <li><a href="index.html" data-i18n="nav.home">Home</a></li>
      <li><a href="services/index.html" data-i18n="nav.services">Services</a></li>
      <li><a href="services/apply.html" data-i18n="nav.apply">Apply</a></li>
      <li><a href="help.html" data-i18n="nav.help">Help and FAQ</a></li>
      <li><a href="contact.html" data-i18n="nav.contact">Contact us</a></li>
    </ul>
  </nav>
</header>

<main id="main" tabindex="-1">

<h1 data-i18n="contact.title">Contact us</h1>
<p data-i18n="contact.text">Send us a message and we will respond within three working days.</p>
<div id="form-status" role="alert" aria-live="assertive"></div>
<form id="contact-form" action="/submit" method="post" novalidate>
  <p data-i18n="form.required_note">Fields marked with * are required.</p>
  <div class="field">
    <label for="name"><span data-i18n="form.name">Full name</span> *</label>
    <input id="name" name="name" type="text" autocomplete="name" required aria-required="true" aria-describedby="name-error">
    <span id="name-error" class="error"></span>
  </div>
  <div class="field">
    <label for="email"><span data-i18n="form.email">Email address</span> *</label>
    <input id="email" name="email" type="email" autocomplete="email" required aria-required="true" aria-describedby="email-error">
    <span id="email-error" class="error"></span>
  </div>
  <div class="field">
    <label for="message"><span data-i18n="form.message">Your message</span> *</label>
    <textarea id="message" name="message" required aria-required="true" aria-describedby="message-error"></textarea>
    <span id="message-error" class="error"></span>
  </div>
  <button type="submit" data-i18n="form.submit">Send message</button>
</form>

</main>
<footer>
  <ul>
    <li><a href="privacy.html" data-i18n="footer.privacy">Privacy policy</a></li>
    <li><a href="accessibility.html" data-i18n="footer.a11y">Accessibility statement</a></li>
    <li><a href="grievance.html" data-i18n="footer.grievance">Grievance redressal</a></li>
  </ul>
</footer>
<script src="js/i18n.js"></script>
<script src="js/dialog.js"></script>
<script src="js/form.js"></script>
</body>
</html>
