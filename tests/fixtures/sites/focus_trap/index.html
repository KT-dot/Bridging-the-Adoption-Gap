<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Trap Fixture – Track application</title>
<style>
body { font: 16px/1.5 sans-serif; margin: 1rem; }
a:focus, button:focus, input:focus { outline: 3px solid #1d4ed8; }
.custom-btn { display: inline-block; padding: 10px 14px; background: #1d4ed8; color: #fff; cursor: pointer; }
.modal { border: 2px solid #000; padding: 1rem; background: #fff; }
</style></head>
<body>
<header><nav aria-label="Main"><ul>
<li><a href="index.html">Home</a></li><li><a href="status.html">Status</a></li><li><a href="help.html">Help</a></li>
</ul></nav></header>
<main>
<h1>Track your application</h1>
<p>Enter your reference number to see the status of your application.</p>
<div class="custom-btn" role="button" id="print">Print this page</div>
<p><button type="button" id="open-terms" aria-haspopup="dialog" aria-controls="terms">Read terms</button></p>
<div id="terms" role="dialog" aria-modal="true" aria-label="Terms" class="modal" hidden>
  <p>These are the terms of use.</p>
  <button type="button" id="terms-ok">I agree</button>
</div>
<div id="search-widget">
  <label for="ref">Reference number</label>
  <input id="ref" type="text">
  <button type="button" id="go">Search</button>
</div>
<p><a href="help.html">Get help</a></p>
</main>
<footer><a href="privacy.html">Privacy</a></footer>
<script>
// Keyboard trap: Tab and Shift+Tab cycle between the input and the button forever,
// and Escape does nothing.
var ref = document.getElementById("ref"), go = document.getElementById("go");
function trap(e) {
  if (e.key === "Tab") { e.preventDefault(); (document.activeElement === ref ? go : ref).focus(); }
}
ref.addEventListener("keydown", trap);
go.addEventListener("keydown", trap);
// Broken modal: opens but does not move focus, no Escape handling, focus not returned.
document.getElementById("open-terms").addEventListener("click", function () { document.getElementById("terms").hidden = false; });
document.getElementById("terms-ok").addEventListener("click", function () { document.getElementById("terms").hidden = true; });
document.getElementById("print").addEventListener("click", function () { window.print(); });
</script>
</body></html>
