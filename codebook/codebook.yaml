  # --------------------------------------------------------------- RESOURCES
  - id: RES-01
    name: Page weight and standardized load
    category: RES
    label: ux_research_indicator
    requirement_level: descriptive
    availability_semantics: subject_presence
    definition: Transferred bytes, request count, load-event time and LCP under the configured throttled cold-load profile.
    barrier: Heavy pages exclude users on low bandwidth or limited data.
    applicability: {condition: Page loaded., not_applicable_when: Declared non-web project.}
    detectors:
      runtime: [{id: rt.load_measure, status: implemented}]
    decision_rules:
      availability: {present: measured.}
      verification: {pass: "all configured study thresholds met", fail: "any exceeded", not_tested: "no thresholds configured (default)"}
    evidence_required: [measurements]
    automation_limitations: Single cold load per page; network variance.
    manual_review: {required: false, instructions: ""}
    wcag: []
    <<: *defaults

