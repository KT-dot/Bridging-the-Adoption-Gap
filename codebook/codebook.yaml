    category: FORM
    label: ux_research_indicator
    requirement_level: conditional_indicator
    availability_semantics: implementation
    definition: Long applications offer save-draft / continue-later.
    barrier: Users with limited time, connectivity or support cannot finish in one sitting.
    applicability: {condition: "metadata long_process true or a journey flagged long.", not_applicable_when: "metadata long_process false; unknown otherwise (result descriptive)."}
    detectors:
      static: [{id: st.save_resume, status: implemented}]
      runtime: [{id: rt.keywords, status: implemented}]
    decision_rules:
      availability: {present: "save/resume cue observed", not_found_in_scope: "none", not_applicable: "long_process false"}
      verification: {not_tested: "Always (human review)."}
    evidence_required: [cue]
    automation_limitations: Heuristic.
    manual_review: {required: true, instructions: "Verify a draft can be resumed."}
    wcag: []
    <<: *defaults

  - id: FORM-11
    name: Plain-language proxy measures
    category: FORM
    label: ux_research_indicator
    requirement_level: descriptive
    availability_semantics: subject_presence
    definition: "Clearly named proxies only: mean sentence length (words) and share of words with >= 7 letters (Latin script) / mean sentence length for other scripts."
    barrier: Complex language excludes people with cognitive disabilities and low literacy.
    applicability: {condition: Visible text >= 100 words., not_applicable_when: Less text.}
    detectors:
      runtime: [{id: rt.text_metrics, status: implemented}]
    decision_rules:
      availability: {present: "text measured", not_applicable: "too little text"}
      verification: {not_tested: "Always; plain language requires human judgement."}
    evidence_required: [metrics]
    automation_limitations: Proxies do not measure comprehension.
    manual_review: {required: true, instructions: "Rate instructions for plain language."}
